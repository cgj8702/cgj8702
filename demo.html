<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momo — Interactive Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--color-primary)',
                        primaryHover: 'var(--color-primary-hover)',
                        textColor: 'var(--color-text)',
                        accent: 'var(--color-accent)',
                        muted: 'var(--color-muted)',
                    }
                }
            }
        }
    </script>
</head>

<body class="flex flex-col min-h-screen">

    <div id="nav-placeholder"></div>

    <main
        class="flex-grow max-w-[1100px] w-full mx-auto px-6 pt-36 pb-24 grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-center z-10 relative">

        <!-- Left Copy -->
        <div class="space-y-6">
            <span class="text-primary font-heading font-bold text-sm tracking-wider uppercase">Live Experience</span>
            <h2 class="font-heading text-4xl md:text-5xl font-bold leading-tight text-textColor">
                Experience emotional intelligence.
            </h2>
            <p class="font-sans text-lg text-textColor/80 leading-relaxed">
                Our chat screen design offers a gentle, non-judgmental digital architecture to reflect on issues and
                decompress. Share whatever sits heavy on your mind today.
            </p>

            <!-- Interactive Input Form -->
            <div class="pt-2">
                <form class="waitlist-form w-full max-w-[400px]">
                    <div class="sakura-glass p-1.5 flex items-center rounded-full h-[52px] border border-white/60">
                        <label for="demo-waitlist-email" class="sr-only">Email Address</label>
                        <input id="demo-waitlist-email" type="email" placeholder="your@email.com" required
                            class="flex-grow bg-transparent border-none text-textColor placeholder:text-muted focus:ring-0 text-sm px-4 outline-none font-sans">
                        <button type="submit"
                            class="bg-primary hover:bg-primaryHover text-white font-heading font-bold text-sm px-6 h-full rounded-full transition-all duration-300">
                            Bloom
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Right Screen (Dynamic Mockup Container) -->
        <div class="relative w-full max-w-[480px] h-[580px] mx-auto">

            <!-- Overlapping Decorative Blurred Cloud Vector -->
            <div
                class="absolute -top-10 -left-12 z-0 ambient-float opacity-70 filter blur-sm pointer-events-none text-accent">
                <svg fill="currentColor" height="120" viewBox="0 0 24 24" width="180"
                    xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M19.36 10.04a6 6 0 00-11.12-2.24 4 4 0 00-.24 7.96h11.36a3.5 3.5 0 000-7z"></path>
                </svg>
            </div>

            <!-- Overlapping Decorative Soft Glow Foreground Layer Cloud -->
            <div
                class="absolute -bottom-10 -right-10 z-20 ambient-float-reverse opacity-50 filter blur-[8px] pointer-events-none text-white">
                <svg fill="currentColor" height="110" viewBox="0 0 24 24" width="160"
                    xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M19.36 10.04a6 6 0 00-11.12-2.24 4 4 0 00-.24 7.96h11.36a3.5 3.5 0 000-7z"></path>
                </svg>
            </div>

            <!-- Glassmorphic Chat Shell -->
            <div class="sakura-glass rounded-[32px] w-full h-full relative z-10 flex flex-col overflow-hidden">

                <!-- Header -->
                <div class="px-6 py-4 border-b border-white/30 flex items-center gap-3 bg-white/20">
                    <div
                        class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-primary shadow-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-11.314l.707.707m11.314 11.314l.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="font-heading font-bold text-textColor text-base">Momo</h3>
                        <p class="text-xs text-muted font-sans font-medium">Listening gently</p>
                    </div>
                </div>

                <!-- Chat Bubble Workspace -->
                <div id="chat-messages"
                    class="flex-grow p-6 space-y-4 overflow-y-auto custom-scrollbar flex flex-col bg-white/10"
                    role="log" aria-live="polite">

                    <!-- Default Momo Prompt -->
                    <div class="flex items-start gap-3 w-full">
                        <div
                            class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-primary flex-shrink-0 shadow-sm mt-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5"
                                viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-11.314l.707.707m11.314 11.314l.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z">
                                </path>
                            </svg>
                        </div>
                        <div class="bubble-momo text-textColor py-3 px-5 shadow-sm font-sans max-w-[75%]">
                            How is your heart today?
                        </div>
                    </div>

                    <!-- Default Simulated User Reply -->
                    <div class="flex items-start justify-end gap-3 w-full">
                        <div class="bubble-user text-textColor py-3 px-5 shadow-sm font-sans max-w-[75%]">
                            A bit overwhelmed, honestly.
                        </div>
                    </div>

                </div>

                <!-- Interactive Input Footer -->
                <div class="p-4 border-t border-white/30 bg-white/25">
                    <form id="chat-form"
                        class="bg-white/60 rounded-full flex items-center px-4 py-2 border border-white/80 focus-within:border-primary transition-all">
                        <label for="chat-input" class="sr-only">Message Momo</label>
                        <input id="chat-input" type="text" placeholder="Type gently..."
                            class="bg-transparent border-none focus:ring-0 text-textColor placeholder-muted w-full font-sans text-sm py-1 outline-none">
                        <button type="submit"
                            class="text-primary hover:text-primaryHover transition-colors flex items-center justify-center p-1"
                            aria-label="Send Message">
                            <svg class="w-5 h-5 transform rotate-90" fill="none" stroke="currentColor"
                                stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0L5 12m7-7l7 7">
                                </path>
                            </svg>
                        </button>
                    </form>
                </div>

            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>

</html>
