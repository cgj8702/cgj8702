<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momo — Your Gentle AI Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--color-primary)',
                        primaryHover: 'var(--color-primary-hover)',
                        textColor: 'var(--color-text)',
                        accent: 'var(--color-accent)',
                        muted: 'var(--color-muted)',
                    }
                }
            }
        }
    </script>
</head>

<body class="flex flex-col min-h-screen">

    <div id="nav-placeholder"></div>

    <main class="flex-grow flex flex-col justify-center items-center px-6 pt-36 pb-24 relative">
        <div class="absolute -top-10 left-10 w-72 h-72 bg-accent/25 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-10 right-10 w-96 h-96 bg-primary/10 rounded-full blur-3xl pointer-events-none">
        </div>

        <div class="max-w-[800px] text-center z-10 flex flex-col items-center">
            <div class="ambient-float mb-8 bg-white/40 p-4 rounded-full border border-white/60 shadow-lg">
                <svg class="w-16 h-16 text-primary" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19.36 10.04a6 6 0 00-11.12-2.24 4 4 0 00-.24 7.96h11.36a3.5 3.5 0 000-7z" />
                </svg>
            </div>

            <h1 class="font-heading text-5xl md:text-6xl font-bold leading-tight text-textColor mb-6">
                Your gentle AI companion.
            </h1>
            <p class="font-sans text-lg md:text-xl text-textColor/80 max-w-[620px] mb-12 leading-relaxed">
                Momo listens, reflects, and helps you bloom. Join the waitlist for a serene, digital landing space
                designed to reduce daily anxiety.
            </p>

            <div class="w-full max-w-[480px]" id="waitlist-section">
                <form class="waitlist-form w-full">
                    <div class="sakura-glass p-2 flex items-center rounded-full h-[64px] transition-all duration-300">
                        <label for="waitlist-email" class="sr-only">Email Address</label>
                        <input id="waitlist-email" type="email" placeholder="your@email.com" required
                            class="flex-grow bg-transparent border-none text-textColor placeholder:text-muted focus:ring-0 text-base px-6 outline-none font-sans">
                        <button type="submit"
                            class="bg-primary hover:bg-primaryHover text-white font-heading font-bold text-base px-8 h-full rounded-full transition-all duration-300 transform active:scale-95 flex items-center justify-center min-w-[120px]">
                            Bloom
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div class="text-center pb-12 z-10">
        <a href="demo.html"
            class="inline-flex items-center gap-2 text-primary hover:text-primaryHover font-heading font-bold transition-all hover:translate-x-1">
            <span>Step into the garden (Try interactive demo)</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
        </a>
    </div>

    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>

</html>
